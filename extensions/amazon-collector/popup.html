<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Amazon / 1688 采集助手</title>
    <style>
      body {
        margin: 0;
        width: 360px;
        background: #0f172a;
        color: #e2e8f0;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .wrap {
        padding: 16px;
      }
      .title {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .sub {
        color: #94a3b8;
        font-size: 12px;
        margin-bottom: 16px;
      }
      .card {
        background: rgba(15, 23, 42, 0.65);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      .label {
        width: 64px;
        color: #94a3b8;
        flex: none;
      }
      .value {
        flex: 1;
        word-break: break-word;
      }
      .muted {
        color: #94a3b8;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      button, a.button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
      }
      button.primary {
        background: #2563eb;
        color: #fff;
        flex: 1;
      }
      button.secondary, a.button.secondary {
        background: rgba(148, 163, 184, 0.12);
        color: #e2e8f0;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .status {
        min-height: 20px;
        font-size: 12px;
        color: #fbbf24;
      }
      .status.success {
        color: #34d399;
      }
      .status.error {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="title">Amazon / 1688 采集助手</div>
      <div class="sub">识别当前 Amazon 或 1688 页面，并按任务上下文采集到系统。</div>

      <div class="card">
        <div class="row">
          <div id="pageLabel" class="label">页面</div>
          <div id="pageValue" class="value muted">识别中...</div>
        </div>
        <div class="row">
          <div id="primaryLabel" class="label">主标识</div>
          <div id="primaryValue" class="value muted">识别中...</div>
        </div>
        <div class="row">
          <div class="label">标题</div>
          <div id="titleValue" class="value muted">识别中...</div>
        </div>
        <div class="row">
          <div class="label">价格</div>
          <div id="priceValue" class="value muted">识别中...</div>
        </div>
        <div class="row">
          <div id="contextLabel" class="label">上下文</div>
          <div id="contextValue" class="value muted">识别中...</div>
        </div>
      </div>

      <div id="status" class="status"></div>

      <div class="actions">
        <button id="collectButton" class="primary">立即采集</button>
        <a class="button secondary" href="options.html" target="_blank">配置</a>
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
  </html>
