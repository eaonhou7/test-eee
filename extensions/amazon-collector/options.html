<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Amazon / 1688 采集助手设置</title>
    <style>
      body {
        margin: 0;
        background: #020617;
        color: #e2e8f0;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .wrap {
        max-width: 840px;
        margin: 0 auto;
        padding: 32px 24px 48px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }
      p {
        margin: 0 0 20px;
        color: #94a3b8;
      }
      .panel {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 16px;
        padding: 20px;
      }
      .field {
        margin-bottom: 18px;
      }
      .field label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }
      .field .help {
        margin-top: 6px;
        color: #94a3b8;
        font-size: 12px;
      }
      input, textarea {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid rgba(148, 163, 184, 0.28);
        border-radius: 12px;
        padding: 12px 14px;
        background: rgba(15, 23, 42, 0.9);
        color: #f8fafc;
        font: inherit;
      }
      textarea {
        min-height: 140px;
        resize: vertical;
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 8px;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      button.primary {
        background: #2563eb;
        color: #fff;
      }
      button.secondary {
        background: rgba(148, 163, 184, 0.12);
        color: #e2e8f0;
      }
      .status {
        margin-top: 14px;
        min-height: 22px;
        color: #fbbf24;
      }
      .status.success {
        color: #34d399;
      }
      .status.error {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Amazon / 1688 采集助手设置</h1>
      <p>填写系统后端地址和 API Token。插件会直接调用 `/amazonCollector/extension/upsertDetail` 和 `/amazon1688Collector/extension/upsertDetail` 把 Amazon / 1688 详情页写入系统采集池。</p>

      <div class="panel">
        <div class="field">
          <label for="apiBaseUrl">后台 API Base URL</label>
          <input id="apiBaseUrl" type="text" placeholder="例如 https://your-domain.com 或 https://your-domain.com/api" />
          <div class="help">可填写后端直连地址 `http://127.0.0.1:8888`，也可填写前端开发地址 `http://127.0.0.1:8080`，插件会自动尝试补 `/api` 前缀。</div>
        </div>

        <div class="field">
          <label for="apiToken">API Token</label>
          <textarea id="apiToken" placeholder="在系统 API Token 页面签发后粘贴到这里"></textarea>
          <div class="help">插件会把这个 Token 放到请求头 `x-token` 中，不复用网页登录状态。</div>
        </div>

        <div class="actions">
          <button id="saveButton" class="primary">保存配置</button>
          <button id="testButton" class="secondary">测试连接</button>
        </div>
        <div id="status" class="status"></div>
      </div>
    </div>
    <script type="module" src="options.js"></script>
  </body>
  </html>
